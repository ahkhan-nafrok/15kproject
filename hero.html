<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNB - Premium Stone Excellence</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Raleway:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
:root {
  --primary-blue: #2673B8;
  --background-base: #eeeeee;
  --surface-light: #F0F3F7;
  --accent-white: #F7F9FC;
  --text-primary: #1A2332;
  --text-body: #5A6B7F;
  --text-muted: #7A8A9E;
  --border-color: #D4DCE6;
  --border-light: #E3E9F0;
  --whatsapp-green: #25D366;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow-x: hidden;
}

.hero {
    height: 100vh;
    width: 100%;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000000;
    padding-top: 6vh;
}

.hero-video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    z-index: 1;
    object-fit: cover;
}

.hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, 
        rgba(0, 0, 0, 0.6) 0%, 
        rgba(0, 0, 0, 0.4) 50%, 
        rgba(0, 0, 0, 0.7) 100%);
    z-index: 2;
}

.hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 0 2rem;
    max-width: 1400px;
    width: 100%;
}

/* MINIMALIST TITLE - Much Smaller */
.hero-title {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(2rem, 5vw, 3.5rem); /* Was 9rem! Now max 3.5rem */
    font-weight: 900;
    letter-spacing: clamp(-1px, -0.2vw, -2px);
    line-height: 1.1;
    color: #F2F4F7;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeInScale 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8),
                 0 2px 8px rgba(38, 115, 184, 0.3);
}

.hero-title .main-line {
    display: block;
    padding-bottom: 0.2em;
}

.hero-title .blue-text {
    color: var(--primary-blue);
    display: block;
    font-family: 'Raleway', sans-serif;
    font-weight: 800;
    letter-spacing: clamp(2px, 0.5vw, 4px);
    font-size: 0.35em;
    margin-top: 0.6em;
    text-shadow: 0 4px 20px rgba(38, 115, 184, 0.6),
                 0 2px 10px rgba(38, 115, 184, 0.4);
    animation: fadeInUp 1.4s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
    opacity: 0;
}

@keyframes fadeInScale {
    from {
        opacity: 0;
        transform: scale(0.95) translateY(30px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Compact Accent Lines */
.hero-accent-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
    margin-top: 2rem;
    opacity: 0;
    animation: fadeIn 1s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.hero-accent {
    height: 2px;
    background: linear-gradient(90deg, 
        transparent 0%, 
        var(--primary-blue) 50%, 
        transparent 100%);
    animation: pulse 2s ease-in-out infinite;
}

.accent-left {
    width: 0;
    animation: expandLeft 1.2s cubic-bezier(0.4, 0, 0.2, 1) 1.3s forwards,
               pulse 2s ease-in-out 2.5s infinite;
}

.accent-center {
    width: 6px;
    height: 6px;
    background: var(--primary-blue);
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(38, 115, 184, 0.8),
                0 0 30px rgba(38, 115, 184, 0.4);
    animation: glowPulse 2s ease-in-out infinite;
}

.accent-right {
    width: 0;
    animation: expandRight 1.2s cubic-bezier(0.4, 0, 0.2, 1) 1.3s forwards,
               pulse 2s ease-in-out 2.5s infinite;
}

@keyframes expandLeft {
    to { width: 60px; }
}

@keyframes expandRight {
    to { width: 60px; }
}

@keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
}

@keyframes glowPulse {
    0%, 100% {
        box-shadow: 0 0 15px rgba(38, 115, 184, 0.8),
                    0 0 30px rgba(38, 115, 184, 0.4);
        transform: scale(1);
    }
    50% {
        box-shadow: 0 0 25px rgba(38, 115, 184, 1),
                    0 0 50px rgba(38, 115, 184, 0.6);
        transform: scale(1.15);
    }
}

/* Responsive */
@media (max-width: 991px) {
    .hero {
        padding-top: 4vh;
    }
    
    .hero-accent-container {
        margin-top: 1.8rem;
    }
    
    @keyframes expandLeft { to { width: 50px; } }
    @keyframes expandRight { to { width: 50px; } }
}

@media (max-width: 768px) {
    .hero-content {
        padding: 0 1.5rem;
    }
    
    .hero-accent-container {
        margin-top: 1.5rem;
        gap: 0.6rem;
    }
    
    @keyframes expandLeft { to { width: 40px; } }
    @keyframes expandRight { to { width: 40px; } }
    
    .accent-center {
        width: 5px;
        height: 5px;
    }
}

@media (max-width: 576px) {
    .hero {
        padding-top: 20vh;
    }
    
    .hero-content {
        padding: 0 1rem;
    }
    
    .hero-accent-container {
        margin-top: 1.2rem;
    }
    
    @keyframes expandLeft { to { width: 35px; } }
    @keyframes expandRight { to { width: 35px; } }
}

@media (prefers-reduced-motion: reduce) {
    .hero-title,
    .hero-title .blue-text,
    .hero-accent-container,
    .accent-left,
    .accent-right,
    .accent-center {
        animation: none !important;
        opacity: 1;
        transform: none;
        width: auto;
    }
}

@media (max-width: 768px) {
    .hero-video {
        min-width: 110%;
        min-height: 110%;
    }
}
    </style>
</head>
<body>
    <section class="hero" id="home">
        <video class="hero-video" autoplay muted loop playsinline preload="auto" poster="assets/heroo.png">
            <source src="assets/bnb.mp4" type="video/mp4">
            <source src="" type="video/webm">
            Your browser does not support the video tag.
        </video>

        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1 class="hero-title">
                <span class="main-line">BNB ENTERPRISES</span>
                <span class="blue-text">GLOBAL TRADERS</span>
            </h1>
            <div class="hero-accent-container">
                <div class="hero-accent accent-left"></div>
                <div class="accent-center"></div>
                <div class="hero-accent accent-right"></div>
            </div>
        </div>
    </section>

    <script>
    (function() {
        const video = document.querySelector('.hero-video');
        
        if (video) {
            video.play().catch(err => {
                console.log('Video autoplay prevented:', err);
            });

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    video.pause();
                } else {
                    video.play().catch(err => console.log('Video play error:', err));
                }
            });

            if ('connection' in navigator) {
                const connection = navigator.connection;
                if (connection.effectiveType === 'slow-2g' || connection.effectiveType === '2g') {
                    video.style.display = 'none';
                }
            }
        }

        console.log('✅ Minimalist Video Hero initialized');
    })();
    </script>
</body>
</html>
