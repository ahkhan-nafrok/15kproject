<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNB - Premium Stone Excellence</title>
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Raleway:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #2673B8;
            --pure-black: #000000;
            --pure-white: #FFFFFF;
            --light-blue: #3B8FD4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
        }

        /* Premium Video Hero */
        .hero {
            height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--pure-black);
            padding-top: 8vh;
        }

        /* Video Background */
        .hero-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: 1;
            object-fit: cover;
        }

        /* Dark Overlay for Better Text Contrast */
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, 
                rgba(0, 0, 0, 0.6) 0%, 
                rgba(0, 0, 0, 0.4) 50%, 
                rgba(0, 0, 0, 0.7) 100%);
            z-index: 2;
        }

        /* Premium Title Container */
        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 0 2rem;
            max-width: 1800px;
            width: 100%;
        }

        /* Ultra Bold Premium Title with Enhanced Typography */
        .hero-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 9rem;
            font-weight: 900;
            letter-spacing: -4px;
            line-height: 0.95;
            color: var(--pure-white);
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInScale 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
            text-shadow: 0 8px 40px rgba(0, 0, 0, 0.9),
                         0 2px 8px rgba(38, 115, 184, 0.3);
            position: relative;
        }

        .hero-title .main-line {
            display: block;
            position: relative;
            padding-bottom: 0.15em;
        }

        .hero-title .blue-text {
            color: var(--primary-blue);
            display: block;
            font-family: 'Raleway', sans-serif;
            font-weight: 800;
            letter-spacing: 8px;
            font-size: 0.35em;
            margin-top: 0.5em;
            text-shadow: 0 4px 20px rgba(38, 115, 184, 0.6),
                         0 2px 10px rgba(38, 115, 184, 0.4);
            animation: fadeInUp 1.4s cubic-bezier(0.4, 0, 0.2, 1) 0.8s forwards;
            opacity: 0;
        }

        /* Animations */
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(40px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Enhanced Animated Accent Lines */
        .hero-accent-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 3rem;
            opacity: 0;
            animation: fadeIn 1s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .hero-accent {
            height: 3px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                var(--primary-blue) 50%, 
                transparent 100%);
            animation: pulse 2s ease-in-out infinite;
        }

        .accent-left {
            width: 0;
            animation: expandLeft 1.2s cubic-bezier(0.4, 0, 0.2, 1) 1.3s forwards,
                       pulse 2s ease-in-out 2.5s infinite;
        }

        .accent-center {
            width: 8px;
            height: 8px;
            background: var(--primary-blue);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(38, 115, 184, 0.8),
                        0 0 40px rgba(38, 115, 184, 0.4);
            animation: glowPulse 2s ease-in-out infinite;
        }

        .accent-right {
            width: 0;
            animation: expandRight 1.2s cubic-bezier(0.4, 0, 0.2, 1) 1.3s forwards,
                       pulse 2s ease-in-out 2.5s infinite;
        }

        @keyframes expandLeft {
            from {
                width: 0;
            }
            to {
                width: 80px;
            }
        }

        @keyframes expandRight {
            from {
                width: 0;
            }
            to {
                width: 80px;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }

        @keyframes glowPulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(38, 115, 184, 0.8),
                            0 0 40px rgba(38, 115, 184, 0.4);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 30px rgba(38, 115, 184, 1),
                            0 0 60px rgba(38, 115, 184, 0.6);
                transform: scale(1.2);
            }
        }

        /* Responsive Design */
        @media (max-width: 1400px) {
            .hero-title {
                font-size: 8rem;
                letter-spacing: -3px;
            }

            .hero {
                padding-top: 6vh;
            }
        }

        @media (max-width: 1200px) {
            .hero-title {
                font-size: 7rem;
                letter-spacing: -2px;
            }

            .hero-title .blue-text {
                letter-spacing: 6px;
            }
        }

        @media (max-width: 991px) {
            .hero-title {
                font-size: 5.5rem;
                letter-spacing: -1px;
            }

            .hero-title .blue-text {
                letter-spacing: 5px;
            }
            
            .hero-accent-container {
                gap: 0.8rem;
                margin-top: 2.5rem;
            }

            .accent-left,
            .accent-right {
                animation: expandLeft 1.2s cubic-bezier(0.4, 0, 0.2, 1) 1.3s forwards,
                           pulse 2s ease-in-out 2.5s infinite;
            }

            @keyframes expandLeft {
                to { width: 60px; }
            }

            @keyframes expandRight {
                to { width: 60px; }
            }

            .hero {
                padding-top: 5vh;
            }
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 4rem;
                letter-spacing: -1px;
            }

            .hero-title .blue-text {
                letter-spacing: 4px;
                font-size: 0.4em;
            }
            
            .hero-content {
                padding: 0 1.5rem;
            }
            
            .hero-accent-container {
                margin-top: 2rem;
                gap: 0.6rem;
            }

            @keyframes expandLeft {
                to { width: 50px; }
            }

            @keyframes expandRight {
                to { width: 50px; }
            }

            .accent-center {
                width: 6px;
                height: 6px;
            }

            .hero {
                padding-top: 4vh;
            }
        }

        @media (max-width: 576px) {
            .hero-title {
                font-size: 3rem;
            }

            .hero-title .blue-text {
                letter-spacing: 3px;
                margin-top: 0.6em;
            }
            
            .hero-content {
                padding: 0 1rem;
            }
            
            .hero-accent-container {
                margin-top: 1.5rem;
            }

            @keyframes expandLeft {
                to { width: 40px; }
            }

            @keyframes expandRight {
                to { width: 40px; }
            }

            .hero-accent {
                height: 2px;
            }

            .accent-center {
                width: 5px;
                height: 5px;
            }

            .hero {
                padding-top: 28vh;
            }
        }

        @media (max-width: 400px) {
            .hero-title {
                font-size: 2.3rem;
            }

            .hero-title .blue-text {
                letter-spacing: 2px;
            }
        }

        /* Video Loading Optimization */
        @media (prefers-reduced-motion: reduce) {
            .hero-title,
            .hero-title .blue-text,
            .hero-accent-container,
            .accent-left,
            .accent-right,
            .accent-center {
                animation: none !important;
                opacity: 1;
                transform: none;
                width: auto;
            }
        }

        /* Mobile Video Optimization */
        @media (max-width: 768px) {
            .hero-video {
                min-width: 110%;
                min-height: 110%;
            }
        }
    </style>
</head>
<body>
    <section class="hero" id="home">
        <!-- Video Background -->
        <video class="hero-video" autoplay muted loop playsinline preload="auto" poster="heroo.png">
            <source src="assets/bnb.mp4" type="video/mp4">
            <source src="" type="video/webm">
            Your browser does not support the video tag.
        </video>

        <!-- Dark Overlay -->
        <div class="hero-overlay"></div>

        <!-- Premium Title -->
        <div class="hero-content">
            <h1 class="hero-title">
                <span class="main-line">BNB ENTERPRISES</span>
                <span class="blue-text">GLOBAL TRADERS</span>
            </h1>
            <div class="hero-accent-container">
                <div class="hero-accent accent-left"></div>
                <div class="accent-center"></div>
                <div class="hero-accent accent-right"></div>
            </div>
        </div>
    </section>

    <script>
    (function() {
        // Optimize video loading
        const video = document.querySelector('.hero-video');
        
        if (video) {
            // Ensure video plays on iOS devices
            video.play().catch(err => {
                console.log('Video autoplay prevented:', err);
            });

            // Pause video when page is not visible (performance optimization)
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    video.pause();
                } else {
                    video.play().catch(err => console.log('Video play error:', err));
                }
            });

            // Reduce video quality on slower connections
            if ('connection' in navigator) {
                const connection = navigator.connection;
                if (connection.effectiveType === 'slow-2g' || connection.effectiveType === '2g') {
                    video.style.display = 'none';
                }
            }
        }

        console.log('✅ Enhanced Premium Video Hero initialized');
    })();
    </script>
</body>
</html>
