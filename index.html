<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

  <!-- DNS Prefetch -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />

  <!-- CRITICAL: Load fonts in HEAD before any component loads -->
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Raleway:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />

  <title>BNB Enterprises - Global Trading Excellence | Premium Solutions</title>
<style>
/* ========== REFINED COLOR SYSTEM ========== */
:root {
  --primary-blue: #2673B8;
  --background-base: #eeeeee;
  --surface-light: #F0F3F7;
  --accent-white: #F7F9FC;
  --text-primary: #1A2332;
  --text-body: #5A6B7F;
  --text-muted: #7A8A9E;
  --border-color: #D4DCE6;
  --border-light: #E3E9F0;
  --whatsapp-green: #25D366;
}

/* ========== GLOBAL RESET & BASE ========== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  font-family: 'Montserrat', sans-serif;
  background: var(--background-base);
  color: var(--text-body);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ========== PROFESSIONAL MINIMALIST TYPOGRAPHY ========== */
h1, .hero-title, .section-title {
  font-size: clamp(1.75rem, 3.5vw, 2.5rem) !important; /* 28-40px max */
  line-height: 1.2 !important;
  font-weight: 700;
}

h2, .section-subtitle {
  font-size: clamp(1.5rem, 3vw, 2rem) !important; /* 24-32px max */
  line-height: 1.3 !important;
  font-weight: 600;
}

h3, .card-title {
  font-size: clamp(1.125rem, 2vw, 1.375rem) !important; /* 18-22px max */
  line-height: 1.4 !important;
  font-weight: 600;
}

h4 {
  font-size: clamp(1rem, 1.5vw, 1.125rem) !important; /* 16-18px max */
  font-weight: 600;
}

p, .body-text {
  font-size: clamp(0.875rem, 1.2vw, 1rem) !important; /* 14-16px max */
  line-height: 1.6 !important;
  font-weight: 400;
}

.small-text, .caption {
  font-size: clamp(0.75rem, 1vw, 0.875rem) !important; /* 12-14px max */
  line-height: 1.5 !important;
}

.label-text {
  font-size: clamp(0.6875rem, 0.9vw, 0.75rem) !important; /* 11-12px max */
  letter-spacing: clamp(1.5px, 0.2vw, 2px) !important;
  text-transform: uppercase;
  font-weight: 600;
}

/* ========== PAGE LOADER - COMPACT ========== */
.page-loader {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--surface-light);
  z-index: 9999;
  gap: 12px;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

.loader-logo {
  width: clamp(60px, 10vw, 80px); /* Smaller logo */
  height: clamp(60px, 10vw, 80px);
  object-fit: contain;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.05);
    opacity: 0.85;
  }
}

.loader-text {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(0.875rem, 1.5vw, 1.125rem); /* Much smaller */
  font-weight: 700;
  letter-spacing: clamp(2px, 0.5vw, 3px);
  color: var(--text-primary);
}

.loader-subtext {
  font-family: 'Raleway', sans-serif;
  font-size: clamp(0.625rem, 1vw, 0.75rem); /* Much smaller */
  font-weight: 500;
  letter-spacing: clamp(1px, 0.3vw, 2px);
  color: var(--primary-blue);
  text-transform: uppercase;
}

body.loaded .page-loader {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* ========== SITE WRAPPER ========== */
.site-wrapper {
  opacity: 0;
  transition: opacity 0.5s ease;
}

body.loaded .site-wrapper {
  opacity: 1;
}

/* ========== WHATSAPP FLOATING BUTTON - COMPACT ========== */
.whatsapp-float {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 52px; /* Smaller button */
  height: 52px;
  background: var(--whatsapp-green);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 3px 15px rgba(37, 211, 102, 0.25);
  z-index: 9998;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  text-decoration: none;
}

.whatsapp-float:hover {
  transform: scale(1.08) translateY(-2px);
  box-shadow: 0 6px 24px rgba(37, 211, 102, 0.4);
}

.whatsapp-float:active {
  transform: scale(0.96);
}

.whatsapp-float i {
  color: white;
  font-size: 26px; /* Smaller icon */
}

.whatsapp-float::before {
  content: '';
  position: absolute;
  inset: -6px;
  border: 2px solid var(--whatsapp-green);
  border-radius: 50%;
  opacity: 0;
  animation: whatsapp-pulse 2s infinite;
}

@keyframes whatsapp-pulse {
  0% {
    transform: scale(0.9);
    opacity: 0.8;
  }
  100% {
    transform: scale(1.3);
    opacity: 0;
  }
}

/* ========== COMPONENT CONTAINERS ========== */
#navbarComponent,
#heroComponent,
#aboutComponent,
#categoriesComponent,
#galleryComponent,
#contactComponent,
#footerComponent {
  font-family: 'Montserrat', sans-serif;
  width: 100%;
}

#aboutComponent + #categoriesComponent,
#categoriesComponent + #galleryComponent {
  margin-top: 0;
  padding-top: 0;
}

/* ========== RESPONSIVE BREAKPOINTS ========== */
@media (max-width: 1400px) {
  html {
    font-size: 15px;
  }
}

@media (max-width: 1200px) {
  html {
    font-size: 14.5px;
  }
}

@media (max-width: 991px) {
  html {
    font-size: 14px;
  }
  
  .whatsapp-float {
    width: 48px;
    height: 48px;
    bottom: 20px;
    right: 20px;
  }
  
  .whatsapp-float i {
    font-size: 24px;
  }
}

@media (max-width: 768px) {
  html {
    font-size: 14px;
  }
}

@media (max-width: 576px) {
  html {
    font-size: 13.5px;
  }
  
  .whatsapp-float {
    width: 46px;
    height: 46px;
    bottom: 16px;
    right: 16px;
  }
  
  .whatsapp-float i {
    font-size: 22px;
  }
}

@media (max-width: 480px) {
  html {
    font-size: 13px;
  }
}

/* ========== PERFORMANCE OPTIMIZATIONS ========== */
.page-loader,
.whatsapp-float,
.loader-logo {
  transform: translateZ(0);
  will-change: transform, opacity;
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

section {
  scroll-margin-top: 80px; /* Reduced from 100px */
}

:focus-visible {
  outline: 2px solid var(--primary-blue);
  outline-offset: 2px;
}

:focus:not(:focus-visible) {
  outline: none;
}

@media print {
  .page-loader,
  .whatsapp-float {
    display: none !important;
  }
}
</style>
</head>

<body itemscope itemtype="https://schema.org/WebPage">
  <!-- Page Loader -->
  <div class="page-loader" role="status" aria-live="polite" aria-label="Loading BNB Enterprises">
    <img src="assets/bnb.png" alt="BNB Enterprises Logo" class="loader-logo" />
    <div class="loader-text" aria-hidden="true">BNB ENTERPRISES</div>
    <div class="loader-subtext" aria-hidden="true">Global Traders</div>
  </div>

  <!-- Site Wrapper -->
  <div class="site-wrapper">
    <!-- Navbar Component -->
    <nav id="navbarComponent" role="navigation" aria-label="Main Navigation"></nav>

    <!-- Main Content -->
    <main>
      <!-- Hero Component -->
      <header id="heroComponent"></header>

      <!-- About Component -->
      <section id="aboutComponent" aria-label="About BNB Enterprises"></section>

      <!-- Categories Component -->
      <section id="categoriesComponent" aria-label="Product Collections"></section>
      <!-- Contact Component-->
      <section id="contactComponent" aria-label="Contact Information"></section>
    </main>

    <!-- Footer Component -->
    <footer id="footerComponent" role="contentinfo"></footer>
  </div>

  <!-- WhatsApp Floating Button -->
  <a href="https://wa.me/919876543210?text=Hello%20BNB%20Enterprises,%20I%20would%20like%20to%20inquire%20about%20your%20products."
    class="whatsapp-float" 
    target="_blank" 
    rel="noopener noreferrer" 
    aria-label="Contact us on WhatsApp"
    title="Chat with us on WhatsApp">
    <i class="fab fa-whatsapp" aria-hidden="true"></i>
  </a>
<script>
    // ========== GLOBAL COMPONENT INITIALIZATION STORAGE ==========
    window.componentInitializers = {};

    // ========== PERFORMANCE MONITORING ==========
    const performanceMetrics = {
      startTime: performance.now(),
      fontsLoaded: false,
      componentsLoaded: 0
    };

    // ========== FONT LOADING ==========
    document.fonts.ready.then(function () {
      performanceMetrics.fontsLoaded = true;
      console.log('✅ Fonts loaded in', Math.round(performance.now() - performanceMetrics.startTime), 'ms');
    });

    // ========== PAGE INITIALIZATION ==========
    document.addEventListener("DOMContentLoaded", () => {
      const minLoadTime = 1200; // Reduced from 1500ms
      const elapsedTime = performance.now() - performanceMetrics.startTime;
      const remainingTime = Math.max(0, minLoadTime - elapsedTime);

      setTimeout(() => {
        document.body.classList.add("loaded");
        loadComponents();
      }, remainingTime);
    });

    // ========== COMPONENT LOADING SYSTEM ==========
    async function loadComponents() {
      const components = [
        { name: "navbar", target: "navbarComponent" },
        { name: "hero", target: "heroComponent" },
        { name: "about", target: "aboutComponent" },
        { name: "categories", target: "categoriesComponent" },
        { name: "gallery", target: "galleryComponent" },
        { name: "contact", target: "contactComponent" },
        { name: "footer", target: "footerComponent" }
      ];

      for (const comp of components) {
        await loadComponent(comp.name, comp.target);
        performanceMetrics.componentsLoaded++;
      }

      console.log('✅ All components loaded in', Math.round(performance.now() - performanceMetrics.startTime), 'ms');
      
      initializeGlobalInteractions();
    }

    // ========== ENHANCED COMPONENT LOADER - FIXED FOR INTERACTIVE COMPONENTS ==========
    async function loadComponent(name, targetId) {
      try {
        const startTime = performance.now();
        
        const htmlResp = await fetch(`${name}.html`);
        const htmlText = await htmlResp.text();

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlText;

        const targetElement = document.getElementById(targetId);
        if (!targetElement) {
          console.error(`❌ Target element #${targetId} not found`);
          return;
        }

        // Extract and insert CSS
        const styles = tempDiv.querySelectorAll('style');
        styles.forEach(style => {
          const styleElement = document.createElement('style');
          styleElement.innerHTML = style.innerHTML;
          styleElement.setAttribute('data-component', name);

          styleElement.innerHTML = styleElement.innerHTML.replace(
            /font-family:\s*'Montserrat'/gi,
            "font-family: 'Montserrat', sans-serif"
          ).replace(
            /font-family:\s*'Raleway'/gi,
            "font-family: 'Raleway', sans-serif"
          );

          document.head.appendChild(styleElement);
        });

        // Extract scripts
        const scripts = tempDiv.querySelectorAll('script');
        const scriptContents = Array.from(scripts).map(script => script.innerHTML);

        // Clean up
        scripts.forEach(script => script.remove());
        styles.forEach(style => style.remove());
        
        const fontLinks = tempDiv.querySelectorAll('link[href*="fonts.googleapis.com"]');
        fontLinks.forEach(link => link.remove());

        // Insert HTML
        targetElement.innerHTML = tempDiv.innerHTML;

        // ========== CRITICAL: Wait for DOM to settle ==========
        await new Promise(resolve => setTimeout(resolve, 100));

        // ========== EXECUTE SCRIPTS PERSISTENTLY ==========
        scriptContents.forEach(scriptContent => {
          if (scriptContent.trim()) {
            try {
              // Create a wrapper function to isolate component code
              const wrappedCode = `
                (function() {
                  ${scriptContent}
                })();
              `;
              
              // Execute immediately
              const func = new Function(wrappedCode);
              func();

              console.log(`✅ ${name} script executed`);
            } catch (scriptError) {
              console.error(`❌ Error executing script in ${name}:`, scriptError);
            }
          }
        });

        // ========== COMPONENT-SPECIFIC INITIALIZATION ==========
        if (name === 'categories') {
          // Give categories extra time to initialize
          setTimeout(() => {
            if (typeof window.initializeCategories === 'function') {
              window.initializeCategories();
              console.log('✅ Categories manually initialized');
            }
          }, 200);
        }

        if (name === 'gallery') {
          setTimeout(() => {
            if (typeof window.initializeGallery === 'function') {
              window.initializeGallery();
              console.log('✅ Gallery manually initialized');
            }
          }, 300);
        }

        const loadTime = Math.round(performance.now() - startTime);
        console.log(`✅ ${name} loaded in ${loadTime}ms`);

      } catch (err) {
        console.error(`❌ Error loading ${name}:`, err);
      }
    }

    // ========== GLOBAL INTERACTIONS ==========
    function initializeGlobalInteractions() {
      // Smooth scroll
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          const href = this.getAttribute('href');
          if (href === '#') return;
          
          e.preventDefault();
          const targetId = href.substring(1);
          const targetElement = document.getElementById(targetId);
          
          if (targetElement) {
            const headerHeight = 80; // Reduced from 100px
            const targetPosition = targetElement.offsetTop - headerHeight;
            
            window.scrollTo({
              top: targetPosition,
              behavior: 'smooth'
            });
          }
        });
      });

      // Lazy load images
      if ('IntersectionObserver' in window) {
        const imageObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const img = entry.target;
              if (img.dataset.src) {
                img.src = img.dataset.src;
                img.removeAttribute('data-src');
                imageObserver.unobserve(img);
              }
            }
          });
        });

        document.querySelectorAll('img[data-src]').forEach(img => {
          imageObserver.observe(img);
        });
      }

      console.log('✅ Global interactions initialized');
    }

    // ========== CROSS-COMPONENT MESSAGING ==========
    window.addEventListener('message', function (event) {
      if (event.data.type === 'scrollToSection') {
        const sectionId = event.data.sectionId;
        const targetElement = document.getElementById(sectionId);

        if (targetElement) {
          const headerHeight = 80; // Reduced from 100px
          const targetPosition = targetElement.offsetTop - headerHeight;

          window.scrollTo({
            top: targetPosition,
            behavior: 'smooth'
          });
        }
      }
    });

    // ========== ERROR HANDLING ==========
    window.addEventListener('error', function(e) {
      console.error('❌ Global error:', e.error);
    });

    window.addEventListener('unhandledrejection', function(e) {
      console.error('❌ Unhandled promise rejection:', e.reason);
    });

    // ========== PERFORMANCE LOGGING ==========
    window.addEventListener('load', function() {
      const loadTime = Math.round(performance.now() - performanceMetrics.startTime);
      console.log(`
🚀 BNB ENTERPRISES - PERFORMANCE METRICS
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
✅ Total Load Time: ${loadTime}ms
✅ Fonts Loaded: ${performanceMetrics.fontsLoaded ? 'Yes' : 'No'}
✅ Components Loaded: ${performanceMetrics.componentsLoaded}/7
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      `);
    });
  </script>
</body>
</html>
