  <style>
    :root {
      --primary-blue:    #2673B8;
      --background-base: #eeeeee;
      --surface-light:   #F0F3F7;
      --text-primary:    #1A2332;
      --text-body:       #5A6B7F;
      --text-muted:      #7A8A9E;
      --border-color:    #D4DCE6;
      --border-light:    #E3E9F0;
      --whatsapp-green:  #25D366;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--background-base);
      color: var(--text-body);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Typography scale ─────────────────────────────────────────────── */
    h1, .hero-title, .section-title   { font-size: clamp(1.75rem, 3.5vw, 2.5rem);  line-height: 1.2; font-weight: 700; }
    h2, .section-subtitle             { font-size: clamp(1.5rem, 3vw, 2rem);         line-height: 1.3; font-weight: 600; }
    h3, .card-title                   { font-size: clamp(1.125rem, 2vw, 1.375rem);   line-height: 1.4; font-weight: 600; }
    h4                                { font-size: clamp(1rem, 1.5vw, 1.125rem);     font-weight: 600; }
    p, .body-text                     { font-size: clamp(0.875rem, 1.2vw, 1rem);     line-height: 1.6; font-weight: 400; }
    .small-text, .caption             { font-size: clamp(0.75rem, 1vw, 0.875rem);    line-height: 1.5; }
    .label-text                       { font-size: clamp(0.6875rem, 0.9vw, 0.75rem); letter-spacing: clamp(1.5px, 0.2vw, 2px); text-transform: uppercase; font-weight: 600; }

    /* ── Page loader ──────────────────────────────────────────────────── */
    .page-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface-light);
      z-index: 9999;
      gap: 12px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .loader-logo {
      width: clamp(60px, 10vw, 80px);
      height: clamp(60px, 10vw, 80px);
      object-fit: contain;
      animation: loader-pulse 1.8s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes loader-pulse {
      0%, 100% { transform: scale(1);    opacity: 1;    }
      50%       { transform: scale(1.06); opacity: 0.85; }
    }

    .loader-text {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(0.875rem, 1.5vw, 1.125rem);
      font-weight: 700;
      letter-spacing: clamp(2px, 0.5vw, 3px);
      color: var(--text-primary);
    }

    .loader-subtext {
      font-family: 'Raleway', sans-serif;
      font-size: clamp(0.625rem, 1vw, 0.75rem);
      font-weight: 500;
      letter-spacing: clamp(1px, 0.3vw, 2px);
      color: var(--primary-blue);
      text-transform: uppercase;
    }

    /*
      PERF: A subtle progress bar gives users visual feedback that
      something is actually loading — reduces perceived wait time.
    */
    .loader-progress {
      width: clamp(80px, 15vw, 120px);
      height: 2px;
      background: var(--border-color);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 4px;
    }

    .loader-progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary-blue);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* Filled once video is ready */
    .loader-progress-bar.complete {
      width: 100%;
    }

    body.loaded .page-loader { opacity: 0; visibility: hidden; pointer-events: none; }

    /* ── Site wrapper ─────────────────────────────────────────────────── */
    .site-wrapper { opacity: 0; transition: opacity 0.4s ease; }
    body.loaded .site-wrapper { opacity: 1; }

    /* ── WhatsApp FAB ─────────────────────────────────────────────────── */
    .whatsapp-float {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      background: var(--whatsapp-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 15px rgba(37, 211, 102, 0.25);
      z-index: 9998;
      text-decoration: none;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease;
    }

    .whatsapp-float:hover  { transform: scale(1.08) translateY(-2px); box-shadow: 0 6px 24px rgba(37, 211, 102, 0.4); }
    .whatsapp-float:active { transform: scale(0.96); }
    .whatsapp-float i      { color: #fff; font-size: 26px; }

    .whatsapp-float::before {
      content: '';
      position: absolute;
      inset: -6px;
      border: 2px solid var(--whatsapp-green);
      border-radius: 50%;
      opacity: 0;
      animation: wa-pulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes wa-pulse {
      0%   { transform: scale(0.9);  opacity: 0.7; }
      100% { transform: scale(1.35); opacity: 0;   }
    }

    /* ── Component mount points ───────────────────────────────────────── */
    #navbarComponent,
    #heroComponent,
    #aboutComponent,
    #categoriesComponent,
    #exportsComponent,
    #contactComponent,
    #footerComponent {
      font-family: 'Montserrat', sans-serif;
      width: 100%;
    }

    section { scroll-margin-top: 80px; }

    /* ── Focus styles ─────────────────────────────────────────────────── */
    :focus-visible             { outline: 2px solid var(--primary-blue); outline-offset: 2px; }
    :focus:not(:focus-visible) { outline: none; }

    /* ── Responsive font scale ────────────────────────────────────────── */
    @media (max-width: 1400px) { html { font-size: 15px;   } }
    @media (max-width: 1200px) { html { font-size: 14.5px; } }
    @media (max-width: 991px)  { html { font-size: 14px;   }
      .whatsapp-float { width: 48px; height: 48px; bottom: 20px; right: 20px; }
      .whatsapp-float i { font-size: 24px; }
    }
    @media (max-width: 576px)  { html { font-size: 13.5px; }
      .whatsapp-float { width: 46px; height: 46px; bottom: 16px; right: 16px; }
      .whatsapp-float i { font-size: 22px; }
    }
    @media (max-width: 480px)  { html { font-size: 13px; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      html { scroll-behavior: auto; }
    }

    @media print { .page-loader, .whatsapp-float { display: none !important; } }
  </style>
</head>

  <script>
  (function () {
    'use strict';

    // ── Component loader ─────────────────────────────────────────────────
    async function loadComponent(name, targetId) {
      const target = document.getElementById(targetId);
      if (!target) {
        console.warn(`[loader] Skipping "${name}" — #${targetId} not found.`);
        return;
      }

      let html;
      try {
        const res = await fetch(`${name}.html`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        html = await res.text();
      } catch (err) {
        console.error(`[loader] Failed to fetch "${name}.html":`, err);
        return;
      }

      const tpl = document.createElement('template');
      tpl.innerHTML = html;
      const frag = tpl.content;

      frag.querySelectorAll('style').forEach(style => {
        const s = document.createElement('style');
        s.setAttribute('data-component', name);
        s.textContent = style.textContent;
        document.head.appendChild(s);
        style.remove();
      });

      const scriptContents = [];
      frag.querySelectorAll('script').forEach(script => {
        if (script.textContent.trim()) scriptContents.push(script.textContent);
        script.remove();
      });

      frag.querySelectorAll('link[href*="fonts.googleapis.com"]').forEach(l => l.remove());

      target.innerHTML = '';
      target.appendChild(frag);

      scriptContents.forEach(code => {
        const s = document.createElement('script');
        s.setAttribute('data-component', name);
        s.textContent = code;
        document.head.appendChild(s);
      });
    }

    // ── Smooth scroll + lazy images ───────────────────────────────────────
    function initGlobalInteractions() {
      document.addEventListener('click', function (e) {
        const anchor = e.target.closest('a[href^="#"]');
        if (!anchor) return;
        const href = anchor.getAttribute('href');
        if (!href || href === '#') return;
        const targetEl = document.getElementById(href.slice(1));
        if (!targetEl) return;
        e.preventDefault();
        const navbar = document.getElementById('navbarComponent');
        const offset = navbar ? navbar.getBoundingClientRect().height : 0;
        const top    = targetEl.getBoundingClientRect().top + window.scrollY - offset - 8;
        window.scrollTo({ top, behavior: 'smooth' });
      }, { passive: false });

      if ('IntersectionObserver' in window) {
        const imgObserver = new IntersectionObserver((entries, obs) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const img = entry.target;
            if (img.dataset.src) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
            obs.unobserve(img);
          });
        }, { rootMargin: '200px' });
        document.querySelectorAll('img[data-src]').forEach(img => imgObserver.observe(img));
      }
    }

    function whenIdle(fn) {
      'requestIdleCallback' in window
        ? requestIdleCallback(fn, { timeout: 2000 })
        : setTimeout(fn, 200);
    }

    // ── Main bootstrap ────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {

      const progressBar = document.getElementById('loaderProgressBar');

      // Animate progress bar to ~60 % while navbar + hero HTML load
      if (progressBar) progressBar.style.width = '60%';

      const fontsReady = Promise.race([
        document.fonts.ready,
        new Promise(r => setTimeout(r, 800))
      ]);

      // Step 1: Load navbar + hero HTML + fonts in parallel
      await Promise.all([
        loadComponent('navbar', 'navbarComponent'),
        loadComponent('hero',   'heroComponent'),
        fontsReady,
      ]);

      // Step 2: Wait for the hero VIDEO to be ready to play.
      //
      // hero.html dispatches 'heroVideoReady' on document once canplay
      // fires (or after its own 6 s fallback). We race that against a
      // hard 8 s ceiling here so the loader can never block the page
      // indefinitely regardless of network conditions.
      await Promise.race([
        new Promise(resolve => {
          document.addEventListener('heroVideoReady', resolve, { once: true });
        }),
        new Promise(resolve => setTimeout(resolve, 8000))
      ]);

      // Animate progress bar to 100 % to signal "ready"
      if (progressBar) progressBar.classList.add('complete');

      // Small pause so users can see the "complete" state before it fades
      await new Promise(r => setTimeout(r, 250));

      // Step 3: Reveal the page and remove the loader
      document.body.classList.add('loaded');
      initGlobalInteractions();

      const loaderEl = document.getElementById('pageLoader');
      if (loaderEl) {
        loaderEl.addEventListener('transitionend', () => loaderEl.remove(), { once: true });
      }

      // Step 4: Load remaining below-fold sections (non-blocking)
      Promise.all([
        loadComponent('about',      'aboutComponent'),
        loadComponent('categories', 'categoriesComponent'),
        loadComponent('export',     'exportsComponent'),
        loadComponent('contact',    'contactComponent'),
      ]);

      // Step 5: Footer is lowest priority — load during idle time
      whenIdle(() => loadComponent('footer', 'footerComponent'));

    });

  }());
  </script>
