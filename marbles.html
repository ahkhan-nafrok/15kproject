<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Marbles - BNB Enterprises</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
/* ========== COLOR SYSTEM ========== */
:root {
  --primary-blue: #2673B8;
  --background-base: #eeeeee;
  --surface-light: #F0F3F7;
  --accent-white: #F7F9FC;
  --text-primary: #1A2332;
  --text-body: #5A6B7F;
  --text-muted: #7A8A9E;
  --border-color: #D4DCE6;
  --border-light: #E3E9F0;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Montserrat', sans-serif;
    background: var(--background-base);
    color: var(--text-body);
    overflow-x: hidden;
}

/* MARBLES SECTION */
.marbles-section {
    background: var(--background-base);
    padding: clamp(2.5rem, 4vw, 3.5rem) 0 clamp(2rem, 3vw, 3rem);
    min-height: 100vh;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 clamp(1rem, 4vw, 3rem);
}

/* HEADER - MINIMAL */
.page-header {
    margin-bottom: clamp(2rem, 3.5vw, 3rem);
}

.breadcrumb {
    font-family: 'Raleway', sans-serif;
    font-size: clamp(0.65rem, 0.8vw, 0.7rem);
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--text-muted);
    opacity: 0.8;
    margin-bottom: 0.8rem;
    text-transform: uppercase;
}

.breadcrumb a {
    color: var(--primary-blue);
    text-decoration: none;
    transition: opacity 0.3s ease;
}

.breadcrumb a:hover {
    opacity: 0.7;
}

/* BACK BUTTON */
.back-button {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: clamp(0.6rem, 0.8vw, 0.7rem) clamp(1rem, 1.5vw, 1.2rem);
    margin-bottom: 1.2rem;
    background: var(--surface-light);
    border: 1px solid var(--border-color);
    color: var(--text-body);
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(0.65rem, 0.8vw, 0.7rem);
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 4px;
}

.back-button i {
    font-size: 0.75rem;
    transition: transform 0.3s ease;
}

.back-button:hover {
    background: var(--text-primary);
    color: var(--accent-white);
    border-color: var(--text-primary);
    transform: translateX(-3px);
}

.back-button:hover i {
    transform: translateX(-3px);
}

.page-title {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(2rem, 4.5vw, 3.2rem);
    font-weight: 900;
    letter-spacing: -1.5px;
    color: var(--text-primary);
    line-height: 1.1;
    margin-bottom: clamp(0.5rem, 1vw, 0.8rem);
}

/* RESULTS BAR */
.results-bar {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding: clamp(0.9rem, 1.2vw, 1.2rem) 0;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: clamp(1.8rem, 2.5vw, 2.5rem);
}

.results-count {
    font-family: 'Raleway', sans-serif;
    font-size: clamp(0.8rem, 0.95vw, 0.85rem);
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--text-body);
    opacity: 0.8;
}

.results-count span {
    color: var(--primary-blue);
    font-weight: 700;
}

/* PRODUCTS GRID - OPTIMIZED SIZING */
.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: clamp(1.5rem, 2.5vw, 2rem);
    margin-bottom: 3rem;
}

@media (min-width: 1200px) {
    .products-grid {
        grid-template-columns: repeat(4, 1fr);
        max-width: 1300px;
    }
}

@media (min-width: 1400px) {
    .products-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}

/* PRODUCT CARD - CLEAN & MINIMAL */
.product-card {
    background: white;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
    display: block;
    text-decoration: none;
    position: relative;
}

.product-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--primary-blue);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 10;
    border-radius: 8px 8px 0 0;
}

.product-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 50px rgba(26, 35, 50, 0.15);
    border-color: var(--primary-blue);
}

.product-card:hover::before {
    transform: scaleX(1);
}

/* IMAGE CONTAINER - PERFECT RATIO */
.product-image-container {
    position: relative;
    width: 100%;
    padding-top: 100%;
    overflow: hidden;
    background: var(--border-light);
}

.product-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.product-card:hover .product-image {
    transform: scale(1.08);
}

/* PRODUCT NAME - CENTERED */
.product-name {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(0.95rem, 1.1vw, 1.05rem);
    font-weight: 800;
    letter-spacing: 0.3px;
    color: var(--text-primary);
    text-align: center;
    padding: clamp(1.1rem, 1.4vw, 1.3rem);
    line-height: 1.3;
    transition: color 0.3s ease;
}

.product-card:hover .product-name {
    color: var(--primary-blue);
}

/* RESPONSIVE DESIGN */
@media (max-width: 1199px) {
    .products-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 991px) {
    .products-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 576px) {
    .products-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
    }
    
    .product-image-container {
        padding-top: 95%;
    }
}

/* SCROLL ANIMATIONS */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.animate-on-scroll {
    opacity: 0;
    animation: fadeInUp 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}

/* LOADING STATE */
.product-image {
    background: linear-gradient(90deg, var(--border-light) 0%, var(--surface-light) 50%, var(--border-light) 100%);
    background-size: 200% 100%;
}

.product-image[src] {
    background: none;
}
</style>
</head>
<body>
    <section class="marbles-section">
        <div class="container">
            <!-- PAGE HEADER -->
            <div class="page-header">
                <div class="breadcrumb">
                    <a href="index.html">Home</a> / <a href="#collections">Collections</a> / <span>Premium Marbles</span>
                </div>
                <button class="back-button" id="backButton">
                    <i class="fas fa-arrow-left"></i>
                    Back
                </button>
                <h1 class="page-title">Premium Marbles</h1>

                <!-- RESULTS BAR -->
                <div class="results-bar">
                    <div class="results-count">
                        Showing <span>9</span> premium marble collections
                    </div>
                </div>
            </div>

            <!-- PRODUCTS GRID -->
            <div class="products-grid" id="productsGrid">
                <!-- PRODUCT 1 -->
                <a href="Marbles/rain-forest-brown.html" class="product-card">
                    <div class="product-image-container">
                        <img src="Marbles/RAIN-FOREST-BROWN.webp" alt="Rain Forest Brown Marble" class="product-image">
                    </div>
                    <h3 class="product-name">Rain Forest Brown Marble</h3>
                </a>

                <!-- PRODUCT 2 -->
                <a href="Marbles/rain-forest-green.html" class="product-card">
                    <div class="product-image-container">
                        <img src="Marbles/RAIN-FOREST-GREEN.webp" alt="Rain Forest Green Marble" class="product-image">
                    </div>
                    <h3 class="product-name">Rain Forest Green Marble</h3>
                </a>

                <!-- PRODUCT 3 -->
                <a href="Marbles/forest-green.html" class="product-card">
                    <div class="product-image-container">
                        <img src="Marbles/Forest-green.webp" alt="Forest Green Marble" class="product-image">
                    </div>
                    <h3 class="product-name">Forest Green Marble</h3>
                </a>

                <!-- PRODUCT 4 -->
                <a href="Marbles/spider-green.html" class="product-card">
                    <div class="product-image-container">
                        <img src="Marbles/spider-green.webp" alt="Spider Green Marble" class="product-image">
                    </div>
                    <h3 class="product-name">Spider Green Marble</h3>
                </a>

                <!-- PRODUCT 5 -->
                <a href="Marbles/brown-fantasy.html" class="product-card">
                    <div class="product-image-container">
                        <img src="Marbles/BROWN-FANTASY.webp" alt="Brown Fantasy Marble" class="product-image">
                    </div>
                    <h3 class="product-name">Brown Fantasy Marble</h3>
                </a>

                <!-- PRODUCT 6 -->
                <a href="Marbles/chamboard.html" class="product-card">
                    <div class="product-image-container">
                        <img src="Marbles/chamboard.webp" alt="Chamboard Marble" class="product-image">
                    </div>
                    <h3 class="product-name">Chamboard Marble</h3>
                </a>

                <!-- PRODUCT 7 -->
                <a href="Marbles/fantasy-brown-dark.html" class="product-card">
                    <div class="product-image-container">
                        <img src="Marbles/Fantasy-Brown-Dark.webp" alt="Fantasy Brown Dark Marble" class="product-image">
                    </div>
                    <h3 class="product-name">Fantasy Brown Dark Marble</h3>
                </a>

                <!-- PRODUCT 8 -->
                <a href="Marbles/panda-white.html" class="product-card">
                    <div class="product-image-container">
                        <img src="Marbles/PANDA-WHITE.webp" alt="Panda White Marble" class="product-image">
                    </div>
                    <h3 class="product-name">Panda White Marble</h3>
                </a>

                <!-- PRODUCT 9 -->
                <a href="Marbles/river-white.html" class="product-card">
                    <div class="product-image-container">
                        <img src="Marbles/RIVER-WHITE.webp" alt="River White Marble" class="product-image">
                    </div>
                    <h3 class="product-name">River White Marble</h3>
                </a>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ===== BACK BUTTON =====
            const backButton = document.getElementById('backButton');
            
            if (backButton) {
                backButton.addEventListener('click', function() {
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = 'index.html';
                    }
                });
            }

            // ===== SCROLL ANIMATIONS =====
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -60px 0px'
            };

            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animate-on-scroll');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            const header = document.querySelector('.page-header');
            if (header) observer.observe(header);

            const productCards = document.querySelectorAll('.product-card');
            productCards.forEach((card, index) => {
                card.style.animationDelay = `${index * 0.08}s`;
                observer.observe(card);
            });

            // ===== LAZY LOAD IMAGES =====
            const images = document.querySelectorAll('.product-image');
            const imageObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.src;
                        imageObserver.unobserve(img);
                    }
                });
            });

            images.forEach(img => imageObserver.observe(img));

            console.log('✅ BNB Premium Marbles - Simplified Gallery');
        });
    </script>
</body>
</html>
