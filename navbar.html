<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Navbar - BNB Enterprises</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Raleway:wght@700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
/* ========== COLOR SYSTEM ========== */
    :root {
      --primary-blue: #2673B8;
      --pure-black: #000000;
      --pure-white: #F2F4F7;
      --off-white: #EDF0F4;
      --text-dark: #0A0A0A;
      --light-gray: #E8EBF0;
      --whatsapp-green: #25D366;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    
    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--off-white);
      color: var(--text-dark);
      min-height: 200vh;
    }

    /* Premium Minimal Header */
    .header {
      position: fixed;
      top: 0;
      width: 100%;
      background: transparent;
      z-index: 1000;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      padding: 2rem 0 1.5rem 0;
    }
    
    .header.scrolled {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(25px) saturate(180%);
      padding: 1.2rem 0 1rem 0;
      box-shadow: 0 2px 20px rgba(38, 115, 184, 0.08);
    }

    .header.scrolled .nav-link {
      color: var(--text-dark);
    }

    .header.scrolled .menu-toggle span {
      background: var(--text-dark);
    }

    /* Dynamic Logo Switching */
    .header .logo-white {
      display: block;
    }

    .header .logo-black {
      display: none;
    }

    .header.scrolled .logo-white {
      display: none;
    }

    .header.scrolled .logo-black {
      display: block;
    }
    
    /* Vertical Nav Layout - Logo Top, Links Bottom */
    .nav {
      max-width: 1800px;
      margin: 0 auto;
      padding: 0 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    
    /* Premium Centered Logo */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
      z-index: 1001;
      position: relative;
    }

    .logo-img-wrapper {
      width: 190px;
      height: 190px;
      position: relative;
      overflow: visible;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header.scrolled .logo-img-wrapper {
      width: 150px;
      height: 150px;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .logo:hover .logo-img {
      transform: scale(1.05);
    }

    /* Minimal Nav Links - Centered Below Logo */
    .nav-links {
      display: flex;
      gap: 3.5rem;
      list-style: none;
      align-items: center;
      margin: 0;
    }
    
    .nav-link {
      text-decoration: none;
      color: var(--pure-white);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase;
      padding: 0.5rem 0;
    }
    
    .nav-link::before {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--primary-blue);
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .nav-link:hover {
      color: var(--primary-blue);
    }
    
    .nav-link:hover::before {
      width: 100%;
    }

    /* Ultra Minimal Menu Toggle */
    .menu-toggle {
      display: none;
      cursor: pointer;
      background: none;
      border: none;
      width: 26px;
      height: 20px;
      position: absolute;
      top: 50%;
      right: 2rem;
      transform: translateY(-50%);
      z-index: 1002;
      padding: 0;
    }

    .menu-toggle span {
      display: block;
      width: 100%;
      height: 2px;
      background: var(--pure-white);
      position: absolute;
      left: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 2px;
    }

    .menu-toggle span:nth-child(1) {
      top: 0;
    }

    .menu-toggle span:nth-child(2) {
      top: 50%;
      transform: translateY(-50%);
    }

    .menu-toggle span:nth-child(3) {
      bottom: 0;
    }

    .menu-toggle.active span:nth-child(1) {
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
      background: var(--primary-blue);
    }

    .menu-toggle.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.active span:nth-child(3) {
      bottom: 50%;
      transform: translateY(50%) rotate(-45deg);
      background: var(--primary-blue);
    }

    /* Demo Hero Section */
    .hero-demo {
      height: 100vh;
      background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .content-demo {
      padding: 4rem 2rem;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .nav {
        padding: 0 3rem;
      }

      .nav-links {
        gap: 2.5rem;
      }

      .nav-link {
        font-size: 0.85rem;
      }

      .logo-img-wrapper {
        width: 120px;
        height: 120px;
      }

      .header.scrolled .logo-img-wrapper {
        width: 90px;
        height: 90px;
      }
    }

    @media (max-width: 991px) {
      .header {
        padding: 1rem 0;
      }

      .header.scrolled {
        padding: 0.8rem 0;
      }

      .nav {
        padding: 0 2rem;
        flex-direction: row;
        justify-content: center;
        gap: 0;
      }

      .logo-img-wrapper {
        width: 125px;
        height: 125px;
      }

      .header.scrolled .logo-img-wrapper {
        width: 75px;
        height: 75px;
      }
      
      .menu-toggle {
        display: block;
      }
      
      /* Premium White Mobile Menu */
      .nav-links {
        position: fixed;
        top: 0;
        right: -100%;
        width: 100%;
        max-width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #FFFFFF 0%, #F8F9FA 100%);
        flex-direction: column;
        justify-content: flex-start;
        align-items: flex-start;
        gap: 0;
        padding: 8rem 3rem 3rem 3rem;
        transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
      }
      
      .nav-links.active {
        right: 0;
      }

      .nav-links li {
        width: 100%;
        text-align: left;
        opacity: 0;
        transform: translateX(-30px);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .nav-links.active li {
        opacity: 1;
        transform: translateX(0);
      }

      .nav-links.active li:nth-child(1) { transition-delay: 0.1s; }
      .nav-links.active li:nth-child(2) { transition-delay: 0.15s; }
      .nav-links.active li:nth-child(3) { transition-delay: 0.2s; }
      .nav-links.active li:nth-child(4) { transition-delay: 0.25s; }
      .nav-links.active li:nth-child(5) { transition-delay: 0.3s; }

      .nav-link {
        font-family: 'Raleway', sans-serif;
        font-size: 1.6rem;
        padding: 0.8rem 0;
        width: 100%;
        color: var(--text-dark) !important;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .nav-link::before {
        display: none;
      }

      .nav-link:hover {
        color: var(--primary-blue) !important;
        transform: translateX(10px);
      }

      /* Mobile Menu Footer */
      .mobile-menu-footer {
        display: block;
        margin-top: 3rem;
        padding-top: 2rem;
        border-top: 1px solid rgba(38, 115, 184, 0.15);
        opacity: 0;
        transform: translateX(-30px);
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .nav-links.active .mobile-menu-footer {
        opacity: 1;
        transform: translateX(0);
        transition-delay: 0.35s;
      }

      .menu-contact-item {
        margin-bottom: 1.5rem;
      }

      .menu-contact-item h4 {
        font-family: 'Montserrat', sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--primary-blue);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 0.5rem;
      }

      .menu-contact-item p {
        font-family: 'Montserrat', sans-serif;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-dark);
        line-height: 1.6;
        margin: 0;
      }

      .menu-contact-item a {
        color: var(--text-dark);
        text-decoration: none;
        transition: color 0.3s ease;
      }

      .menu-contact-item a:hover {
        color: var(--primary-blue);
      }
    }

    @media (max-width: 768px) {
      .logo-img-wrapper {
        width: 125px;
        height:125px;
      }

      .header.scrolled .logo-img-wrapper {
        width: 65px;
        height: 65px;
      }

      .nav-link {
        font-size: 1.4rem;
      }

      .menu-contact-item h4 {
        font-size: 0.7rem;
      }

      .menu-contact-item p {
        font-size: 0.85rem;
      }

      .menu-toggle {
        right: 1.5rem;
      }
    }
    
    @media (max-width: 480px) {
      .nav {
        padding: 0 1.5rem;
      }

      .logo-img-wrapper {
        width: 95px;
        height: 95px;
      }

      .header.scrolled .logo-img-wrapper {
        width: 85px;
        height: 85px;
      }

      .menu-toggle {
        width: 24px;
        height: 18px;
        right: 1.5rem;
      }

      .nav-link {
        font-size: 1.3rem;
        padding: 0.7rem 0;
      }

      .nav-links {
        padding: 7rem 2rem 2rem 2rem;
      }

      .menu-contact-item {
        margin-bottom: 1.2rem;
      }

      .menu-contact-item h4 {
        font-size: 0.65rem;
      }

      .menu-contact-item p {
        font-size: 0.8rem;
      }
    }

    /* Menu Overlay */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
      z-index: 999;
      backdrop-filter: blur(8px);
    }

    .menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Hide mobile footer on desktop */
    .mobile-menu-footer {
      display: none;
    }

    @media (max-width: 991px) {
      .mobile-menu-footer {
        display: block;
      }
    }
  </style>
</head>
<body>

  <!-- Premium Minimal Header -->
  <header class="header" id="header">
    <nav class="nav">
      <a href="#home" class="logo">
        <div class="logo-img-wrapper">
          <!-- White logo for transparent navbar -->
          <img src="assets/bnbwhite.png" alt="BNB Enterprises" class="logo-img logo-white">
          <!-- Blue logo for scrolled navbar -->
          <img src="assets/bnb.png" alt="BNB Enterprises" class="logo-img logo-black">
        </div>
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-links" id="navLinks">
        <li><a class="nav-link" href="#home">Home</a></li>
        <li><a class="nav-link" href="#">About</a></li>
        <li><a class="nav-link" href="#">Collections</a></li>
        <li><a class="nav-link" href="#">Gallery</a></li>
        <li><a class="nav-link" href="#">Contact</a></li>
        
        <div class="mobile-menu-footer">
          <div class="menu-contact-item">
            <h4>Address</h4>
            <p>123 Business Street,<br>Mumbai, Maharashtra 400001</p>
          </div>
          <div class="menu-contact-item">
            <h4>Contact</h4>
            <p><a href="tel:+919876543210">+91 98765 43210</a></p>
            <p><a href="mailto:info@bnbenterprises.com">info@bnbenterprises.com</a></p>
          </div>
        </div>
      </ul>
    </nav>
  </header>

  <div class="menu-overlay" id="menuOverlay"></div>

  <script>
  (function() {
    function initNavbar() {
      const header = document.getElementById('header');
      const menuToggle = document.getElementById('menuToggle');
      const navLinks = document.getElementById('navLinks');
      const menuOverlay = document.getElementById('menuOverlay');
      
      if (!header || !menuToggle || !navLinks) {
        setTimeout(initNavbar, 100);
        return;
      }

      console.log('✅ Premium Minimalist Navbar initialized');

      // Mobile menu toggle
      menuToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        menuToggle.classList.toggle('active');
        navLinks.classList.toggle('active');
        menuOverlay.classList.toggle('active');
        document.body.style.overflow = navLinks.classList.contains('active') ? 'hidden' : 'auto';
      });

      // Close menu on overlay click
      menuOverlay.addEventListener('click', () => {
        menuToggle.classList.remove('active');
        navLinks.classList.remove('active');
        menuOverlay.classList.remove('active');
        document.body.style.overflow = 'auto';
      });

      // Close nav on link click
      const allNavLinks = document.querySelectorAll('.nav-link');
      allNavLinks.forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          
          // Close mobile menu
          menuToggle.classList.remove('active');
          navLinks.classList.remove('active');
          menuOverlay.classList.remove('active');
          document.body.style.overflow = 'auto';
          
          // Smooth scroll
          const targetId = link.getAttribute('href').substring(1);
          const targetElement = document.getElementById(targetId);
          
          if (targetElement) {
            const headerHeight = 100;
            const targetPosition = targetElement.offsetTop - headerHeight;
            
            window.scrollTo({
              top: targetPosition,
              behavior: 'smooth'
            });
          }
        });
      });

      // Scroll effect
      let lastScroll = 0;
      window.addEventListener('scroll', () => {
        const currentScroll = window.scrollY;
        
        if (currentScroll > window.innerHeight * 0.3) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }
        
        lastScroll = currentScroll;
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initNavbar);
    } else {
      initNavbar();
    }
  })();
  </script>
</body>
</html>
